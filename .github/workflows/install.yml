name: Install

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Install, upgrade, push, uninstall
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      - name: Build the agent
        run: |
          cmake -S agent -B agent/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build agent/build

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      # Before the installer: it decides whether the backend can be a service
      # while it runs, so installing nssm afterwards would be too late.
      - name: Install nssm
        run: choco install nssm --no-progress --yes

      - name: Install SysWatch
        run: .\deploy\Install-SysWatch.ps1 -SkipAdminAccount

      - name: Assert both services are running
        shell: pwsh
        run: |
          foreach ($name in 'SysWatchAgent', 'SysWatchBackend') {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $service = Get-Service -Name $name -ErrorAction SilentlyContinue
              if ($service.Status -eq 'Running') { break }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)

            if ($service.Status -ne 'Running') {
              throw "$name is '$($service.Status)', expected Running"
            }
            "$name is running"
          }

      - name: Assert the backend answers
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(30)
          do {
            try { $health = Invoke-RestMethod http://127.0.0.1:8000/api/health; break } catch { Start-Sleep -Seconds 2 }
          } while ((Get-Date) -lt $deadline)

          if ($health.version -ne (Get-Content VERSION).Trim()) {
            throw "health reported '$($health.version)'"
          }
          "health: $($health | ConvertTo-Json -Compress)"

      - name: Remember the session secret
        shell: pwsh
        run: |
          $line = Select-String -Path C:\ProgramData\SysWatch\syswatch.env -Pattern '^SYSWATCH_SESSION_SECRET=(.+)$'
          $secret = $line.Matches[0].Groups[1].Value
          "secret=$secret" >> $env:GITHUB_ENV

      - name: Upgrade over the existing install
        run: .\deploy\Install-SysWatch.ps1 -SkipAdminAccount

      - name: Assert the upgrade kept the secret and the services
        shell: pwsh
        run: |
          $line = Select-String -Path C:\ProgramData\SysWatch\syswatch.env -Pattern '^SYSWATCH_SESSION_SECRET=(.+)$'
          $now = $line.Matches[0].Groups[1].Value

          if ($now -cne $env:secret) {
            throw "the upgrade regenerated the session secret, signing every user out"
          }
          "session secret survived the upgrade"

          foreach ($name in 'SysWatchAgent', 'SysWatchBackend') {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $service = Get-Service -Name $name -ErrorAction SilentlyContinue
              if ($service.Status -eq 'Running') { break }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)
            if ($service.Status -ne 'Running') { throw "$name is '$($service.Status)' after the upgrade" }
          }

      # --- the other kind of install ------------------------------------------
      #
      # Everything above is the single-machine install: the agent serves
      # loopback and the backend beside it polls. This is the second case, and
      # until now nothing exercised it at all.
      #
      # It is not two machines - that is the definition of done this does not
      # close - but every part except the second machine is real: a token from
      # the shipped command, written by the installer into the restricted
      # config, read by the agent from that file, and authenticated at the
      # ingestion endpoint.
      #
      # Loopback deliberately, and with no -AllowInsecurePush. A credential
      # that never leaves the machine needs no opt-out, and that exemption is
      # worth a test of its own: getting it wrong would force the warning on
      # every single-machine install.
      - name: Issue an agent token
        shell: pwsh
        run: |
          # Set by the installer machine-wide, but this process started before
          # it existed. The trap deployment.md warns about, met here for real.
          $env:SYSWATCH_CONFIG_FILE = 'C:\ProgramData\SysWatch\syswatch.env'
          $python = 'C:\Program Files\SysWatch\.venv\Scripts\python.exe'

          Push-Location 'C:\Program Files\SysWatch\backend'
          $output = & $python -m app.auth.create_agent_token --host ci-pushed --description "install workflow"
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "create_agent_token exited $LASTEXITCODE" }

          # "Agent token N issued for ...", then the token, then the notes.
          $token = ($output | Where-Object { $_.Trim() } | Select-Object -Skip 1 -First 1).Trim()
          if (-not $token) { throw "no token in: $($output -join '|')" }

          # Registered with the runner so it is redacted if anything ever
          # prints it. It is a credential even though this one is disposable.
          Write-Host "::add-mask::$token"
          "token=$token" >> $env:GITHUB_ENV
          "issued a token for ci-pushed"

      - name: Reinstall as a machine that pushes
        run: |
          .\deploy\Install-SysWatch.ps1 -SkipAdminAccount `
            -BackendUrl http://127.0.0.1:8000/api/ingest/snapshot `
            -AgentToken $env:token

      - name: Assert the push configuration was written, and only what was asked for
        shell: pwsh
        run: |
          $config = 'C:\ProgramData\SysWatch\syswatch.env'
          $text = Get-Content $config -Raw

          foreach ($key in 'SYSWATCH_AGENT_BACKEND_URL', 'SYSWATCH_AGENT_TOKEN') {
            if ($text -notmatch "(?m)^$key=") { throw "$key is missing from syswatch.env" }
          }

          # Loopback does not need the opt-out, so the installer must not have
          # written one. An install that quietly turns it on would make the
          # setting meaningless everywhere else.
          if ($text -match '(?m)^SYSWATCH_AGENT_ALLOW_INSECURE_PUSH=') {
            throw "the installer set an insecure-push opt-out for a loopback backend"
          }

          # The same check the plain upgrade makes, because this install reads
          # the secret back through the same code path the agent settings use.
          $line = Select-String -Path $config -Pattern '^SYSWATCH_SESSION_SECRET=(.+)$'
          if ($line.Matches[0].Groups[1].Value -cne $env:secret) {
            throw "configuring a push regenerated the session secret"
          }

          # The file now holds a second credential; it must still be locked.
          $acl = (icacls $config) -join "`n"
          if ($acl -match 'Everyone|BUILTIN\\Users') { throw "syswatch.env is readable too widely:`n$acl" }
          "push configured, secret kept, file still restricted"

      - name: Assert the agent actually pushed
        shell: pwsh
        run: |
          $env:SYSWATCH_CONFIG_FILE = 'C:\ProgramData\SysWatch\syswatch.env'
          $python = 'C:\Program Files\SysWatch\.venv\Scripts\python.exe'
          $listing = @()

          # last_seen_at is written only when a push authenticates, so this is
          # the whole chain in one assertion: config file to agent to network
          # to token verification.
          $deadline = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 5
            Push-Location 'C:\Program Files\SysWatch\backend'
            $listing = & $python -m app.auth.create_agent_token --list
            Pop-Location
            $row = ($listing | Select-String -Pattern 'ci-pushed').Line
            $used = $row -and ($row -notmatch 'never')
          } while (-not $used -and (Get-Date) -lt $deadline)

          if (-not $used) { throw "nothing arrived with the token:`n$($listing -join "`n")" }
          "the token has been used"

      - name: Assert the snapshot was filed under the token's host, not the machine's
        shell: pwsh
        run: |
          $env:SYSWATCH_CONFIG_FILE = 'C:\ProgramData\SysWatch\syswatch.env'
          $python = 'C:\Program Files\SysWatch\.venv\Scripts\python.exe'

          # One line, like every other call into the install: a here-string
          # inside a YAML block scalar is one indentation mistake from a parse
          # error on a machine nobody is watching.
          $listHosts = 'from app.db import init_engine; from app.repositories import SnapshotStore; init_engine(); print(",".join(h.host_name for h in SnapshotStore().hosts()))'

          Push-Location 'C:\Program Files\SysWatch\backend'
          $hosts = (& $python -c $listHosts) -join ''
          Pop-Location

          "hosts: $hosts"

          # The name came from the credential. The machine calls itself
          # something else entirely, and the poller files under that - so both
          # names present is the proof that identity is not read from the
          # payload, where this agent would have reported its own hostname.
          if ($hosts -notmatch 'ci-pushed') { throw "nothing filed under 'ci-pushed'" }
          if ($hosts -notmatch [regex]::Escape($env:COMPUTERNAME)) {
            throw "the polled host '$env:COMPUTERNAME' is missing, so these may be the same rows"
          }
          "pushed and polled snapshots are filed under different hosts"

      # The guard rail, in a real run rather than a unit test. It has to refuse
      # *and* leave the install alone: a check that fires after copying files
      # would be a check that half-upgrades a working machine.
      - name: Assert a remote plain-HTTP push is refused, and nothing is touched
        shell: pwsh
        run: |
          $before = Get-Content C:\ProgramData\SysWatch\syswatch.env -Raw

          # A child process, so the refusal's own 'exit 1' can be read rather
          # than ending this step. The messages go through Write-Host, so
          # stdout carries them and stderr needs no redirect - which under this
          # shell's ErrorActionPreference would be its own failure mode.
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\deploy\Install-SysWatch.ps1 -SkipAdminAccount `
            -BackendUrl http://backend.invalid:8000/api/ingest/snapshot `
            -AgentToken not-a-real-token
          $code = $LASTEXITCODE

          if ($code -eq 0) { throw "the installer accepted a plain-HTTP push to another machine" }
          if (($output -join ' ') -notmatch 'in clear') {
            throw "refused, but not for the expected reason:`n$($output -join "`n")"
          }

          if ((Get-Content C:\ProgramData\SysWatch\syswatch.env -Raw) -cne $before) {
            throw "the refused install rewrote the configuration anyway"
          }
          foreach ($name in 'SysWatchAgent', 'SysWatchBackend') {
            if ((Get-Service -Name $name).Status -ne 'Running') {
              throw "$name was stopped by an install that refused to run"
            }
          }
          "refused, and the existing install is untouched"

          # The runner appends `exit $LASTEXITCODE` to every step, and the
          # refusal deliberately left it at 1. Without this, a step that passed
          # reports the failure it was checking for.
          exit 0

      - name: Uninstall, keeping the data
        run: .\deploy\Uninstall-SysWatch.ps1

      - name: Assert the services are gone and the data is not
        shell: pwsh
        run: |
          foreach ($name in 'SysWatchAgent', 'SysWatchBackend') {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw "$name is still registered" }
          }
          if (Test-Path 'C:\Program Files\SysWatch') { throw "the install directory is still there" }
          if (-not (Test-Path C:\ProgramData\SysWatch\syswatch.db)) {
            throw "the database was deleted by an uninstall that was not asked to"
          }
          "services removed, data kept"

      - name: Uninstall again, this time removing the data
        run: .\deploy\Uninstall-SysWatch.ps1 -RemoveData -Force

      - name: Assert the data is gone
        shell: pwsh
        run: |
          if (Test-Path C:\ProgramData\SysWatch) { throw "the data directory survived -RemoveData" }
          "data directory removed"

      # Last, deliberately. `if: failure()` only looks backwards: a step in the
      # middle is skipped on a clean run and never reconsidered, so a failure
      # in the upgrade or uninstall half would have printed nothing at all.
      - name: Show the logs when something failed
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem C:\ProgramData\SysWatch\logs -ErrorAction SilentlyContinue
          foreach ($log in 'syswatch.log', 'agent.log', 'backend-stderr.log') {
            $path = "C:\ProgramData\SysWatch\logs\$log"
            if (Test-Path $path) { "--- $log ---"; Get-Content $path -Tail 40 }
          }
