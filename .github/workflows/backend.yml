name: Backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "scripts/**"
      - "deploy/**"
      - "VERSION"
      - ".github/workflows/backend.yml"

  # No paths filter here, deliberately, though the push trigger above has one.
  #
  # A required status check that never runs is not skipped - it stays pending,
  # and blocks the merge for good. A documentation-only pull request would be
  # unmergeable the moment these become required checks. Running all three on
  # every pull request costs a few minutes and makes branch protection mean
  # what it says.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    # windows-latest, not ubuntu. config.py branches on os.name, and the
    # non-Windows branch is not the one that ships: data lands in ./data rather
    # than %PROGRAMDATA%\SysWatch. A green Linux run would be testing a path no
    # deployment takes.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. 3.10 is what Install-SysWatch.ps1 accepts
        # as a minimum, so without it that check is a claim nothing tests; 3.14
        # is what the project is developed against. Every pinned dependency
        # declares >=3.10, so the floor is a real one rather than a guess.
        python: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          # The pip download cache, keyed on the lockfile. A cached virtualenv
          # would be the unsafe version of this - it survives a dependency
          # being removed from requirements.txt and keeps importing it.
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Versions
        working-directory: backend
        run: |
          python --version
          python -m pip --version

      # No -q: on a red run the useful output is the failure, and there is no
      # second chance to re-run with more detail on someone else's machine.
      - name: pytest
        working-directory: backend
        run: python -m pytest

      # Once, not once per interpreter: the source is identical across the
      # matrix, and two jobs uploading the same artifact name is an error.
      - uses: actions/upload-artifact@v6
        if: matrix.python == '3.14'
        with:
          name: backend
          path: |
            backend
            !backend/tests
            !backend/.venv
            !backend/**/__pycache__
            !backend/data
          retention-days: 14

  postgresql:
    name: pytest (PostgreSQL)
    # ubuntu-latest, unlike the job above, because GitHub does not run service
    # containers on Windows runners. The trade is deliberate and narrow: this
    # job exists to execute the SQL, and the platform-dependent half of the
    # application - config.py's os.name branch, the deploy scripts - is already
    # covered by the Windows job on every run.
    #
    # PostgreSQL is not a supported deployment. docs/deployment.md documents
    # SQLite and only SQLite, the installer builds SQLite, and nothing here
    # changes that. What this tests is a claim: that SnapshotStore and the rest
    # of the repository layer are the whole of the storage boundary, so a
    # different engine is a configuration change. The claim was made in Sprint
    # 10 and had never been run.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway container on the runner's own loopback, torn down with
          # the job. Not a credential, and deliberately not read from a secret:
          # a repository secret here would suggest there is something to
          # protect.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syswatch
        ports:
          - 5432:5432
        # Without this the first test can beat the server to being ready, and
        # the job fails on a connection refused that says nothing about the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # One interpreter, not the matrix. The floor and ceiling are about
          # what the installer accepts; this job is about what the database
          # does, and running it twice would test PostgreSQL twice.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        # psycopg is installed here rather than added to requirements.txt. The
        # installer builds production virtual environments from that file, and
        # nothing that ships opens a PostgreSQL connection.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "psycopg[binary]"

      - name: pytest
        working-directory: backend
        env:
          SYSWATCH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/syswatch
        run: python -m pytest

